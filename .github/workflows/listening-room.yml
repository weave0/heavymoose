name: Listening Room
on:
  pull_request:
    branches: [main]
    paths: ['listen/**', 'scripts/*listen*', '.github/workflows/listening-room.yml']
  push:
    branches: [main, feat/listening-room]
    paths: ['listen/**', 'scripts/*listen*', 'assets/audio/**', 'assets/images/**', '.github/workflows/listening-room.yml']
permissions:
  contents: read
concurrency:
  group: listening-room-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate catalog and player
        run: |
          node --test scripts/test-listen.mjs
          node --check listen/app.js
          node --check listen/sw.js
      - name: Build isolated static app
        run: node scripts/build-listen.cjs
      - name: Check deployment configuration
        id: deploy-config
        if: github.event_name == 'push'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Validation passed. Automatic publishing needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets; use the documented local deploy command meanwhile." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish Listening Room only
        if: github.event_name == 'push' && steps.deploy-config.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Separate project; never deploys to the production heavymoose project.
          command: pages deploy dist/listen --project-name=heavymoose-listen --branch=main
