name: Sync YouTube library

on:
    workflow_dispatch:
    schedule:
        - cron: "17 */6 * * *"
    push:
        branches: [ feat/youtube-library-auto-sync ]
        paths:
            - "scripts/sync-youtube-library.js"
            - "shared/youtube-library.js"
            - "shared/heavy-moose-nav.js"
            - "package.json"
            - ".github/workflows/youtube-library-sync.yml"

permissions:
    contents: write

concurrency:
    group: youtube-library-${{ github.ref }}
    cancel-in-progress: true

jobs:
    refresh:
        runs-on: ubuntu-latest
        name: Refresh channel library

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.ref_name }}

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Install dependencies
              run: npm ci

            - name: Refresh YouTube uploads and public view rankings
              run: npm run youtube:sync

            - name: Validate site
              run: |
                  npm run lint:html
                  node --check scripts/sync-youtube-library.js
                  node --check shared/youtube-library.js
                  git diff --check

            - name: Commit refreshed library when changed
              shell: bash
              run: |
                  if git diff --quiet -- assets/data/media-library.json; then
                    echo "YouTube library is already current."
                    exit 0
                  fi
                  git config user.name "heavy-moose-library-bot"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add assets/data/media-library.json
                  git commit -m "chore: refresh YouTube library"
                  git push origin "HEAD:${GITHUB_REF_NAME}"
