name: Sync Heavy Moose media

on:
    workflow_dispatch:
    schedule:
        - cron: "17 */6 * * *"
    push:
        branches: [ main, feat/youtube-library-auto-sync ]
        paths:
            - "scripts/sync-youtube-library.js"
            - "scripts/sync-release-state.js"
            - "scripts/bake-catalog-html.js"
            - "shared/youtube-library.js"
            - "shared/youtube-library.css"
            - "shared/catalog-cards.css"
            - "shared/heavy-moose-nav.js"
            - "package.json"
            - ".github/workflows/youtube-library-sync.yml"

permissions:
    contents: write

concurrency:
    group: heavy-moose-media-${{ github.ref }}
    cancel-in-progress: true

jobs:
    refresh:
        runs-on: ubuntu-latest
        name: Refresh releases and channel library
        env:
            YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.ref_name }}

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Install dependencies
              run: npm ci

            - name: Refresh Apple release catalog
              run: npm run release:sync

            - name: Refresh YouTube uploads and public view rankings
              if: ${{ env.YOUTUBE_API_KEY != '' }}
              run: npm run youtube:sync

            - name: Report missing YouTube API credential
              if: ${{ env.YOUTUBE_API_KEY == '' }}
              run: echo "YOUTUBE_API_KEY is not configured; release data refreshed but YouTube library remains last-known-good."

            - name: Validate site
              run: |
                  npm run lint:html
                  node --check scripts/sync-release-state.js
                  node --check scripts/sync-youtube-library.js
                  node --check scripts/bake-catalog-html.js
                  node --check shared/youtube-library.js
                  node --check shared/heavy-moose-nav.js
                  git diff --check

            - name: Commit refreshed media state when changed
              shell: bash
              run: |
                  CHANGES="$(git status --porcelain -- assets/data/music-catalog.json assets/data/media-library.json assets/images/releases index.html music.html)"
                  if [ -z "$CHANGES" ]; then
                    echo "Heavy Moose media state is already current."
                    exit 0
                  fi
                  git config user.name "heavy-moose-library-bot"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add assets/data/music-catalog.json assets/data/media-library.json assets/images/releases index.html music.html
                  git commit -m "chore: refresh Heavy Moose media"
                  git push origin "HEAD:${GITHUB_REF_NAME}"
